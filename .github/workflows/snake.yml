name: 🐍 Generar Snake de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🐍 Generar animaciones
        uses: Platane/snk@v3
        with:
          github_user_name: franklizenaz
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2360A5FA&color_dots=%231A1B27,%231E3A8A,%232563EB,%233B82F6,%2360A5FA
            dist/github-contribution-grid-snake.svg?color_snake=%2360A5FA&color_dots=%231A1B27,%231E3A8A,%232563EB,%233B82F6,%2360A5FA
            dist/github-contribution-grid-snake.gif?color_snake=%2360A5FA&color_dots=%231A1B27,%231E3A8A,%232563EB,%233B82F6,%2360A5FA&color_background=%231A1B27

      - name: 🚀 Publicar animaciones
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
